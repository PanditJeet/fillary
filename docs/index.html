<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fillary — Relaxing Coloring</title>
<meta name="description" content="Fillary is a calm, tap-to-fill coloring app for kids and grown-ups.">
<style>
  :root { --bg: #0D0F14; --text: #ECE8E1; --muted: #9AA0AD; --accent: #E2B168; --line: #252935; }
  @media (prefers-color-scheme: light) {
    :root { --bg: #FBFAF7; --text: #1F2128; --muted: #5E6472; --accent: #B8792A; --line: #E6E1D8; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--text); font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 560px; padding: 48px 20px; text-align: center; }
  h1 { font-size: 2.4rem; margin: 18px 0 6px; letter-spacing: -0.01em; }
  p { color: var(--muted); margin: 0 auto 24px; }
  nav { display: flex; gap: 18px; justify-content: center; flex-wrap: wrap; border-top: 1px solid var(--line); padding-top: 20px; }
  a { color: var(--accent); }
</style>
</head>
<body>
<main>
  <svg width="88" height="88" viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="46" fill="#0D0F14"/><circle cx="50" cy="50" r="42" fill="none" stroke="#E2B168" stroke-width="3" stroke-dasharray="12 6"/><path d="M50 20 C32 36 26 56 38 72 C43 78 48 81 50 82 C46 72 44 52 50 20 Z" fill="#81B29A"/><path d="M50 20 C68 36 74 56 62 72 C57 78 52 81 50 82 C54 72 56 52 50 20 Z" fill="#E07A5F"/><path d="M50 24 C44 42 44 64 50 78 C56 64 56 42 50 24 Z" fill="#E2B168"/></svg>
  <h1>Fillary</h1>
  <p>A calm, tap-to-fill coloring book for kids and grown-ups. Pick a picture, choose a color, and relax.</p>
  <nav>
    <a href="privacy.html">Privacy Policy</a>
    <a href="mailto:harshrathod4114@gmail.com">Contact</a>
  </nav>
</main>
</body>
</html>
