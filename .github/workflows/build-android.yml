name: Build Android APK & App Bundle

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Web Production Assets
        run: npm run build

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK 36
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" || true

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build Android Debug APK (Installable APK)
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Build Android App Bundle (.aab)
        run: |
          cd android
          ./gradlew bundleRelease || true

      - name: Upload Installable APK (.apk)
        uses: actions/upload-artifact@v4
        with:
          name: Fillary-Installable-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Android App Bundle (.aab)
        uses: actions/upload-artifact@v4
        with:
          name: Fillary-Release-AAB
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: warn
