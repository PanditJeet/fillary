name: Build Android APK & App Bundle

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      # Play Store requires a higher versionCode for every upload
      VERSION_CODE: ${{ github.run_number }}
      # Real AdMob IDs (optional). Without them the build uses Google's test ads.
      ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
      VITE_ADMOB_ANDROID_INTERSTITIAL: ${{ secrets.ADMOB_ANDROID_INTERSTITIAL }}
      VITE_ADMOB_ANDROID_REWARDED: ${{ secrets.ADMOB_ANDROID_REWARDED }}
      HAS_KEYSTORE: ${{ secrets.FILLARY_KEYSTORE_BASE64 != '' }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Web Production Assets
        run: npm run build

      - name: Setup Java JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK 36
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36"

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build Android Debug APK (Installable APK)
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Restore Release Keystore
        if: env.HAS_KEYSTORE == 'true'
        env:
          KS_B64: ${{ secrets.FILLARY_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.FILLARY_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.FILLARY_KEY_ALIAS }}
          KS_KEYPASS: ${{ secrets.FILLARY_KEY_PASSWORD }}
        run: |
          # Remove any spaces / line breaks that sneak in when pasting secrets
          printf '%s' "$KS_B64" | tr -d ' \r\n\t' | base64 -d > "$RUNNER_TEMP/fillary-release.jks"
          clean() { printf '%s' "$1" | tr -d '\r\n' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//'; }
          P="$(clean "$KS_PASS")"; A="$(clean "$KS_ALIAS")"; K="$(clean "$KS_KEYPASS")"
          echo "::add-mask::$P"; echo "::add-mask::$K"
          {
            echo "FILLARY_KEYSTORE_PASSWORD=$P"
            echo "FILLARY_KEY_ALIAS=$A"
            echo "FILLARY_KEY_PASSWORD=$K"
          } >> "$GITHUB_ENV"
          # Clear checks so a wrong secret is obvious in the log
          echo "Key received: $(stat -c%s "$RUNNER_TEMP/fillary-release.jks") bytes, fingerprint $(sha256sum "$RUNNER_TEMP/fillary-release.jks" | cut -c1-16) (pasted text was $(printf '%s' "$KS_B64" | tr -d ' \r\n\t' | wc -c) characters)"
          if ! keytool -list -keystore "$RUNNER_TEMP/fillary-release.jks" -storepass "$P" > "$RUNNER_TEMP/ks.txt" 2>&1; then
            echo "::error::Could not open the keystore. Either FILLARY_KEYSTORE_BASE64 is not the full text of FILLARY_KEYSTORE_BASE64.txt, or FILLARY_KEYSTORE_PASSWORD is wrong."
            exit 1
          fi
          if ! keytool -list -keystore "$RUNNER_TEMP/fillary-release.jks" -storepass "$P" -alias "$A" > /dev/null 2>&1; then
            echo "::error::Key alias '$A' (FILLARY_KEY_ALIAS) is not in this keystore. The keystore contains:"
            grep -i privatekeyentry "$RUNNER_TEMP/ks.txt" | cut -d, -f1
            echo "If it shows 'fillary', re-copy FILLARY_KEYSTORE_BASE64 from the updated FILLARY_KEYSTORE_BASE64.txt."
            exit 1
          fi
          echo "Signing key OK: alias $A found."

      - name: Build Signed Android App Bundle (.aab)
        if: env.HAS_KEYSTORE == 'true'
        env:
          FILLARY_KEYSTORE_FILE: ${{ runner.temp }}/fillary-release.jks
        run: |
          cd android
          ./gradlew bundleRelease

      - name: Note about missing signing key
        if: env.HAS_KEYSTORE != 'true'
        run: echo "::warning::No FILLARY_KEYSTORE_BASE64 secret set - skipped the signed Play Store bundle. See PLAYSTORE_GUIDE.md."

      - name: Upload Installable APK (.apk)
        uses: actions/upload-artifact@v4
        with:
          name: Fillary-Installable-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Android App Bundle (.aab)
        if: env.HAS_KEYSTORE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Fillary-Release-AAB
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
